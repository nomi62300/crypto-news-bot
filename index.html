<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoFlash — Real-Time Crypto News Scanner</title>
  <meta name="description" content="Free CryptoPanic alternative. Real-time crypto news with FinBERT sentiment analysis, coin filters, and fuzzy deduplication for scalping traders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       DESIGN TOKENS
    ===================================================================== */
    :root {
      --bg-base:        #090c14;
      --bg-surface:     #0f1420;
      --bg-card:        #141924;
      --bg-card-hover:  #1a2130;
      --bg-glass:       rgba(20, 25, 36, 0.75);
      --border:         rgba(255,255,255,0.07);
      --border-active:  rgba(99,179,237,0.45);

      --text-primary:   #e8edf5;
      --text-secondary: #8b95a8;
      --text-muted:     #5a6478;

      --accent:         #3d8ef8;
      --accent-glow:    rgba(61,142,248,0.25);

      --bullish:        #00d68f;
      --bullish-bg:     rgba(0,214,143,0.12);
      --bullish-border: rgba(0,214,143,0.30);

      --bearish:        #ff4757;
      --bearish-bg:     rgba(255,71,87,0.12);
      --bearish-border: rgba(255,71,87,0.30);

      --neutral:        #8b95a8;
      --neutral-bg:     rgba(139,149,168,0.10);
      --neutral-border: rgba(139,149,168,0.25);

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  14px;
      --radius-xl:  20px;

      --shadow-card: 0 4px 24px rgba(0,0,0,0.45);
      --shadow-glow: 0 0 30px rgba(61,142,248,0.15);

      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }

    /* =====================================================================
       RESET & BASE
    ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* =====================================================================
       ANIMATED BACKGROUND GRID
    ===================================================================== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61,142,248,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,142,248,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* =====================================================================
       HEADER / NAV
    ===================================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9,12,20,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3d8ef8, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 16px rgba(61,142,248,0.4);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #e8edf5 30%, #3d8ef8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    /* Live indicator */
    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,214,143,0.1);
      border: 1px solid rgba(0,214,143,0.25);
      border-radius: 100px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--bullish);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bullish);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* Updated at */
    .updated-at {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-left: auto;
    }

    /* Refresh button */
    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .btn-refresh:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    .btn-refresh.spinning svg {
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* =====================================================================
       MAIN LAYOUT
    ===================================================================== */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* =====================================================================
       SIDEBAR FILTERS
    ===================================================================== */
    .sidebar {
      position: sticky;
      top: 84px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Sentiment filter buttons */
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
      font-family: inherit;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      border-color: var(--border-active);
    }

    .filter-btn .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-btn .filter-count {
      margin-left: auto;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 1px 6px;
      border-radius: 100px;
    }

    /* Coin filter chips */
    .coin-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .coin-chip {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .coin-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .coin-chip.active {
      background: rgba(61,142,248,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: var(--bg-surface);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* =====================================================================
       CONTENT AREA
    ===================================================================== */
    .content { display: flex; flex-direction: column; gap: 16px; }

    /* Search bar */
    .search-bar {
      position: relative;
    }

    .search-bar svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 14px 11px 42px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all var(--transition);
      outline: none;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* =====================================================================
       NEWS FEED
    ===================================================================== */
    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =====================================================================
       NEWS CARD
    ===================================================================== */
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 20px;
      align-items: start;
      transition: all var(--transition);
      animation: cardIn 0.3s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .news-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--neutral);
      opacity: 0.5;
      transition: opacity var(--transition);
    }

    .news-card.bullish::before { background: var(--bullish); opacity: 0.8; }
    .news-card.bearish::before { background: var(--bearish); opacity: 0.8; }

    .news-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card left */
    .card-left { grid-column: 1; display: flex; flex-direction: column; gap: 10px; }

    /* Card meta row */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .source-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .time-badge {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    /* Coin tags */
    .coin-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .coin-tag {
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(61,142,248,0.12);
      border: 1px solid rgba(61,142,248,0.25);
      color: var(--accent);
    }

    /* Article title */
    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .card-title a:hover { color: var(--accent); }

    /* Card summary */
    .card-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Other sources toggle */
    .other-sources {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .other-sources-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      user-select: none;
    }

    .other-sources-toggle:hover {
      border-color: var(--border-active);
      color: var(--text-secondary);
    }

    .other-sources-toggle svg {
      transition: transform var(--transition);
    }

    .other-sources-toggle.open svg { transform: rotate(180deg); }

    .other-sources-list {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .other-sources-list.open { display: flex; }

    .other-source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .other-source-item a:hover { color: var(--accent); }

    .other-source-item .dot { color: var(--text-muted); }

    /* Card right — sentiment badge */
    .card-right {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .sentiment-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid;
      min-width: 90px;
      text-align: center;
    }

    .sentiment-badge.bullish {
      background: var(--bullish-bg);
      border-color: var(--bullish-border);
      color: var(--bullish);
    }

    .sentiment-badge.bearish {
      background: var(--bearish-bg);
      border-color: var(--bearish-border);
      color: var(--bearish);
    }

    .sentiment-badge.neutral {
      background: var(--neutral-bg);
      border-color: var(--neutral-border);
      color: var(--neutral);
    }

    .sentiment-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sentiment-icon { font-size: 18px; line-height: 1; }

    .confidence-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .confidence-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .bullish .confidence-bar  { background: var(--bullish); }
    .bearish .confidence-bar  { background: var(--bearish); }
    .neutral .confidence-bar  { background: var(--neutral); }

    .confidence-pct {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.7;
    }

    /* =====================================================================
       EMPTY / LOADING STATES
    ===================================================================== */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .state-box .state-icon { font-size: 40px; opacity: 0.4; }
    .state-box .state-msg  { font-size: 14px; }

    /* Skeleton loader */
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-card-hover) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =====================================================================
       COUNTDOWN RING
    ===================================================================== */
    .countdown-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .countdown-ring {
      position: relative;
      width: 28px;
      height: 28px;
    }

    .countdown-ring svg {
      transform: rotate(-90deg);
    }

    .countdown-ring circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .ring-bg   { stroke: var(--border); }
    .ring-fill { stroke: var(--accent); stroke-dasharray: 69.1; transition: stroke-dashoffset 1s linear; }

    .countdown-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
    }

    /* =====================================================================
       TOAST
    ===================================================================== */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text-primary);
      box-shadow: var(--shadow-card);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    #toast.show { transform: translateY(0); opacity: 1; }

    /* =====================================================================
       RESPONSIVE
    ===================================================================== */
    @media (max-width: 900px) {
      .main {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      .sidebar {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .sidebar { grid-template-columns: 1fr; }
      .news-card { grid-template-columns: 1fr; }
      .card-right { flex-direction: row; align-items: center; }
      .sentiment-badge { flex-direction: row; min-width: auto; padding: 6px 10px; }
    }

    /* =====================================================================
       SCROLLBAR
    ===================================================================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4150; }
  </style>
  <!-- Script fallback for direct file:// browsing to bypass local browser CORS locks -->
  <script src="news.js"></script>
</head>

<body>
  <!-- ================================================================
       HEADER
  ================================================================ -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span class="logo-text">CryptoFlash</span>
      </div>

      <div class="live-pill">
        <span class="live-dot"></span>
        Live
      </div>

      <div class="countdown-wrap" id="countdownWrap" title="Next auto-refresh">
        <div class="countdown-ring">
          <svg width="28" height="28" viewBox="0 0 28 28">
            <circle class="ring-bg"   cx="14" cy="14" r="11" />
            <circle class="ring-fill" cx="14" cy="14" r="11" id="ringFill" />
          </svg>
        </div>
        <span class="countdown-text" id="countdownText">5:00</span>
      </div>

      <span class="updated-at" id="updatedAt">—</span>

      <button class="btn-refresh" id="btnRefresh" aria-label="Refresh news feed">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <!-- ================================================================
       MAIN
  ================================================================ -->
  <main class="main">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- Stats -->
      <div class="sidebar-section">
        <div class="sidebar-title">Overview</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="statTotal" style="color:var(--accent)">—</div>
            <div class="stat-label">Stories</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="statBullish" style="color:var(--bullish)">—</div>
            <div class="stat-label">Bullish</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="statBearish" style="color:var(--bearish)">—</div>
            <div class="stat-label">Bearish</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="statNeutral" style="color:var(--neutral)">—</div>
            <div class="stat-label">Neutral</div>
          </div>
        </div>
      </div>

      <!-- Sentiment filter -->
      <div class="sidebar-section">
        <div class="sidebar-title">Sentiment</div>
        <div class="filter-group">
          <button class="filter-btn active" id="filterAll" data-sentiment="all">
            <span class="filter-dot" style="background:var(--accent)"></span>
            All News
            <span class="filter-count" id="countAll">0</span>
          </button>
          <button class="filter-btn" id="filterBullish" data-sentiment="Bullish">
            <span class="filter-dot" style="background:var(--bullish)"></span>
            Bullish
            <span class="filter-count" id="countBullish">0</span>
          </button>
          <button class="filter-btn" id="filterBearish" data-sentiment="Bearish">
            <span class="filter-dot" style="background:var(--bearish)"></span>
            Bearish
            <span class="filter-count" id="countBearish">0</span>
          </button>
          <button class="filter-btn" id="filterNeutral" data-sentiment="Neutral">
            <span class="filter-dot" style="background:var(--neutral)"></span>
            Neutral
            <span class="filter-count" id="countNeutral">0</span>
          </button>
        </div>
      </div>

      <!-- Coin filter -->
      <div class="sidebar-section">
        <div class="sidebar-title">Coins</div>
        <div class="coin-chips" id="coinChips">
          <!-- Dynamically populated -->
        </div>
      </div>

    </aside>

    <!-- Content -->
    <div class="content">

      <!-- Search -->
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
        </svg>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Search headlines, coins, sources…"
          aria-label="Search news"
        />
      </div>

      <!-- Feed -->
      <div class="news-feed" id="newsFeed">
        <!-- Skeleton loaders -->
        <div class="skeleton-card" id="skeleton1">
          <div style="display:flex;gap:8px">
            <div class="skeleton" style="width:90px;height:18px"></div>
            <div class="skeleton" style="width:60px;height:18px"></div>
          </div>
          <div class="skeleton" style="width:100%;height:20px"></div>
          <div class="skeleton" style="width:75%;height:14px"></div>
        </div>
        <div class="skeleton-card">
          <div style="display:flex;gap:8px">
            <div class="skeleton" style="width:80px;height:18px"></div>
          </div>
          <div class="skeleton" style="width:90%;height:20px"></div>
          <div class="skeleton" style="width:60%;height:14px"></div>
        </div>
        <div class="skeleton-card">
          <div style="display:flex;gap:8px">
            <div class="skeleton" style="width:100px;height:18px"></div>
            <div class="skeleton" style="width:45px;height:18px"></div>
          </div>
          <div class="skeleton" style="width:95%;height:20px"></div>
          <div class="skeleton" style="width:80%;height:14px"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite">
    <span id="toastIcon">✓</span>
    <span id="toastMsg">Feed refreshed</span>
  </div>

  <!-- ================================================================
       JAVASCRIPT
  ================================================================ -->
  <script>
    // ----------------------------------------------------------------
    // Constants & State
    // ----------------------------------------------------------------
    const NEWS_URL       = './news.json';
    const REFRESH_SECS   = 300; // auto-refresh every 5 minutes
    const RING_CIRCUM    = 2 * Math.PI * 11; // ≈ 69.1

    let allArticles      = [];
    let activeSentiment  = 'all';
    let activeCoins      = new Set();
    let searchQuery      = '';
    let countdownTimer   = null;
    let countdownRemain  = REFRESH_SECS;

    // ----------------------------------------------------------------
    // DOM refs
    // ----------------------------------------------------------------
    const feed         = document.getElementById('newsFeed');
    const updatedAt    = document.getElementById('updatedAt');
    const btnRefresh   = document.getElementById('btnRefresh');
    const searchInput  = document.getElementById('searchInput');
    const coinChips    = document.getElementById('coinChips');
    const ringFill     = document.getElementById('ringFill');
    const countdownTxt = document.getElementById('countdownText');
    const toast        = document.getElementById('toast');
    const toastMsg     = document.getElementById('toastMsg');
    const toastIcon    = document.getElementById('toastIcon');

    // Stat refs
    const statTotal   = document.getElementById('statTotal');
    const statBullish = document.getElementById('statBullish');
    const statBearish = document.getElementById('statBearish');
    const statNeutral = document.getElementById('statNeutral');

    // Count refs
    const countAll     = document.getElementById('countAll');
    const countBullish = document.getElementById('countBullish');
    const countBearish = document.getElementById('countBearish');
    const countNeutral = document.getElementById('countNeutral');

    // Sentiment buttons
    const sentimentBtns = document.querySelectorAll('.filter-btn[data-sentiment]');

    // ----------------------------------------------------------------
    // Helpers
    // ----------------------------------------------------------------
    function relativeTime(isoStr) {
      if (!isoStr) return '—';
      const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
      if (diff <  60)  return `${Math.floor(diff)}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400)return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg, icon = '✓', duration = 2500) {
      toastMsg.textContent = msg;
      toastIcon.textContent = icon;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ----------------------------------------------------------------
    // Data fetching
    // ----------------------------------------------------------------
    async function fetchNews() {
      btnRefresh.classList.add('spinning');
      try {
        let data;
        
        try {
          const resp = await fetch(`${NEWS_URL}?t=${Date.now()}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          data = await resp.json();
        } catch (fetchErr) {
          // If fetch fails (e.g. local browser CORS restriction on file:// protocol), fallback to preloaded script tag variable
          if (window.newsData) {
            console.log("Fetch failed or CORS blocked. Falling back to local script data.");
            data = window.newsData;
          } else {
            throw fetchErr;
          }
        }

        allArticles = data.articles || [];

        // Updated-at header
        if (data.updated_at) {
          const d = new Date(data.updated_at);
          updatedAt.textContent = `Updated ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
        }

        buildCoinChips();
        updateStats();
        renderFeed();
        resetCountdown();
        showToast(`${allArticles.length} stories loaded`, '⚡');
      } catch (err) {
        console.error('Failed to fetch news:', err);

        // Show error state only if feed is empty
        if (allArticles.length === 0) {
          feed.innerHTML = `
            <div class="state-box">
              <span class="state-icon">📡</span>
              <span class="state-msg">Could not load <code>news.json</code>.<br/>
              Run <code>python fetch_news.py</code> first, then refresh.</span>
            </div>`;
        }
        showToast('Failed to refresh feed', '⚠', 3500);
      } finally {
        btnRefresh.classList.remove('spinning');
      }
    }

    // ----------------------------------------------------------------
    // Build dynamic coin filter chips from actual data
    // ----------------------------------------------------------------
    function buildCoinChips() {
      const coinSet = new Map();
      for (const a of allArticles) {
        for (const c of (a.coins || [])) {
          coinSet.set(c, (coinSet.get(c) || 0) + 1);
        }
      }

      // Sort by frequency
      const sorted = [...coinSet.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30);

      coinChips.innerHTML = sorted.map(([coin]) => {
        const isActive = activeCoins.has(coin);
        return `<button class="coin-chip${isActive ? ' active' : ''}" data-coin="${escHtml(coin)}" aria-pressed="${isActive}">${escHtml(coin)}</button>`;
      }).join('');

      coinChips.querySelectorAll('.coin-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const coin = btn.dataset.coin;
          if (activeCoins.has(coin)) {
            activeCoins.delete(coin);
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
          } else {
            activeCoins.add(coin);
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          renderFeed();
        });
      });
    }

    // ----------------------------------------------------------------
    // Stats panel
    // ----------------------------------------------------------------
    function updateStats() {
      const total   = allArticles.length;
      const bullish = allArticles.filter(a => a.sentiment === 'Bullish').length;
      const bearish = allArticles.filter(a => a.sentiment === 'Bearish').length;
      const neutral = allArticles.filter(a => a.sentiment === 'Neutral' || !a.sentiment).length;

      statTotal.textContent   = total;
      statBullish.textContent = bullish;
      statBearish.textContent = bearish;
      statNeutral.textContent = neutral;

      countAll.textContent     = total;
      countBullish.textContent = bullish;
      countBearish.textContent = bearish;
      countNeutral.textContent = neutral;
    }

    // ----------------------------------------------------------------
    // Filter & render
    // ----------------------------------------------------------------
    function getFiltered() {
      return allArticles.filter(a => {
        // Sentiment
        if (activeSentiment !== 'all' && a.sentiment !== activeSentiment) return false;
        // Coin
        if (activeCoins.size > 0) {
          const coinSet = new Set(a.coins || []);
          const match   = [...activeCoins].some(c => coinSet.has(c));
          if (!match) return false;
        }
        // Search
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const haystack = `${a.title} ${a.source} ${(a.coins||[]).join(' ')}`.toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

    function sentimentClass(s) {
      if (s === 'Bullish') return 'bullish';
      if (s === 'Bearish') return 'bearish';
      return 'neutral';
    }

    function sentimentIcon(s) {
      if (s === 'Bullish') return '▲';
      if (s === 'Bearish') return '▼';
      return '—';
    }

    function renderCard(a, idx) {
      const sc          = sentimentClass(a.sentiment);
      const icon        = sentimentIcon(a.sentiment);
      const confPct     = a.confidence != null ? Math.round(a.confidence * 100) : 0;
      const barWidth    = confPct;
      const hasOthers   = a.other_sources && a.other_sources.length > 0;
      const othersCount = hasOthers ? a.other_sources.length : 0;
      const cardId      = `card-${idx}`;
      const toggleId    = `toggle-${idx}`;
      const listId      = `list-${idx}`;

      const coinTagsHtml = (a.coins || []).slice(0, 6).map(c =>
        `<span class="coin-tag">${escHtml(c)}</span>`
      ).join('');

      const otherSourcesHtml = hasOthers ? `
        <div class="other-sources">
          <button class="other-sources-toggle" id="${toggleId}" aria-expanded="false" aria-controls="${listId}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
            +${othersCount} other source${othersCount > 1 ? 's' : ''}
          </button>
          <div class="other-sources-list" id="${listId}" role="list">
            ${a.other_sources.map(os => `
              <div class="other-source-item" role="listitem">
                <span class="dot">•</span>
                <a href="${escHtml(os.url || '#')}" target="_blank" rel="noopener noreferrer">
                  ${escHtml(os.source)}
                </a>
                <span class="time-badge">${relativeTime(os.published)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      const summaryHtml = a.summary
        ? `<p class="card-summary">${escHtml(a.summary)}</p>`
        : '';

      return `
        <article class="news-card ${sc}" id="${cardId}" data-idx="${idx}">
          <div class="card-left">
            <div class="card-meta">
              <span class="source-badge">${escHtml(a.source || '?')}</span>
              <span class="time-badge">${relativeTime(a.published)}</span>
              ${coinTagsHtml ? `<div class="coin-tags">${coinTagsHtml}</div>` : ''}
            </div>
            <h2 class="card-title">
              <a href="${escHtml(a.url || '#')}" target="_blank" rel="noopener noreferrer">
                ${escHtml(a.title)}
              </a>
            </h2>
            ${summaryHtml}
            ${otherSourcesHtml}
          </div>
          <div class="card-right">
            <div class="sentiment-badge ${sc}">
              <span class="sentiment-icon">${icon}</span>
              <span class="sentiment-label">${escHtml(a.sentiment || 'Neutral')}</span>
              <div class="confidence-bar-wrap">
                <div class="confidence-bar" style="width:${barWidth}%"></div>
              </div>
              <span class="confidence-pct">${confPct}%</span>
            </div>
          </div>
        </article>
      `;
    }

    function renderFeed() {
      const filtered = getFiltered();

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="state-box">
            <span class="state-icon">🔍</span>
            <span class="state-msg">No stories match your filters.</span>
          </div>`;
        return;
      }

      feed.innerHTML = filtered.map((a, i) => renderCard(a, i)).join('');

      // Attach other-sources toggle listeners
      feed.querySelectorAll('.other-sources-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const listEl = document.getElementById(btn.getAttribute('aria-controls'));
          const isOpen = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!isOpen));
          btn.classList.toggle('open', !isOpen);
          listEl.classList.toggle('open', !isOpen);
        });
      });
    }

    // ----------------------------------------------------------------
    // Sentiment filter buttons
    // ----------------------------------------------------------------
    sentimentBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        activeSentiment = btn.dataset.sentiment;
        sentimentBtns.forEach(b => b.classList.toggle('active', b === btn));
        renderFeed();
      });
    });

    // ----------------------------------------------------------------
    // Search input (debounced)
    // ----------------------------------------------------------------
    let searchDebounce = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchQuery = searchInput.value.trim();
        renderFeed();
      }, 200);
    });

    // ----------------------------------------------------------------
    // Refresh button
    // ----------------------------------------------------------------
    btnRefresh.addEventListener('click', fetchNews);

    // ----------------------------------------------------------------
    // Countdown ring
    // ----------------------------------------------------------------
    function resetCountdown() {
      clearInterval(countdownTimer);
      countdownRemain = REFRESH_SECS;
      updateRing();
      countdownTimer = setInterval(() => {
        countdownRemain--;
        updateRing();
        if (countdownRemain <= 0) {
          clearInterval(countdownTimer);
          fetchNews();
        }
      }, 1000);
    }

    function updateRing() {
      const frac   = countdownRemain / REFRESH_SECS;
      const offset = RING_CIRCUM * (1 - frac);
      ringFill.style.strokeDashoffset = offset;
      const m = Math.floor(countdownRemain / 60);
      const s = countdownRemain % 60;
      countdownTxt.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ----------------------------------------------------------------
    // Init
    // ----------------------------------------------------------------
    fetchNews();
  </script>
</body>
</html>
