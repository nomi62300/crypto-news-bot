name: Debug FMP Macro

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python debug_fmp_macro.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
